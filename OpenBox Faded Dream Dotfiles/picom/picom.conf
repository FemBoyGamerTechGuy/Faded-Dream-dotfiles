# ════════════════════════════════════════════════════════════════════════════
#  Faded Dream — picom (the X11 stand-in for Hyprland's compositor effects)
#
#  Upstream Hyprland settings being reproduced:
#    decoration.rounding          = 10      → corner-radius = 10
#    decoration.active_opacity    = 1.0     → active-opacity = 1.0
#    decoration.inactive_opacity  = 0.8     → inactive-opacity = 0.8
#    decoration.shadow             = on,
#      range 4, render_power 3, rgba(1a1a1aee)   → shadow settings below
#    decoration.blur: size 3, passes 1, vibrancy 0.1696  → blur block
#    animations: windows popin 60% (popIn / popOut beziers)
#      → animations block (REQUIRES picom v11+)
#
#  Install to: ~/.config/picom/picom.conf
#  Arch: pacman -S picom   (v11 or newer for popin animations)
# ════════════════════════════════════════════════════════════════════════════

backend = "glx";
vsync = true;
use-damage = true;

# ── Shadows (upstream: enabled, range 4, render_power 3, rgba(1a11aee)) ────
shadow = true;
shadow-radius = 8;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-opacity = 0.93;
shadow-color = "#1a1a1a";
shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'"                # flameshot's selection overlay
];

# ── Opacity (upstream: active 1.0 / inactive 0.8) ─────────────────────────
active-opacity = 1.0;
inactive-opacity = 0.8;
inactive-dim = 0.0;
frame-opacity = 0.8;

# ── Rounded corners (upstream: rounding = 10) ───────────────────────────────
corner-radius = 10.0;
detect-rounded-corners = true;
rounded-corners-exclude = [
  "class_g = 'waybar'",             # bar spans the full width
  "class_g = 'dunst'",
  "class_g = 'slop'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ── Fading (opacity transitions between active/inactive) ───────────────────
fading = true;

# ── Blur (upstream: size 3, passes 1, vibrancy 0.1696) ─────────────────────
blur: {
  method = "kawase";
  strength = 4;
}
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'slop'"
];

# ── Animations (upstream: popIn / popOut "popin 60%") ──────────────────────
#    windowsIn : speed 4, popIn bezier (overshoot) → 250ms, overshoot curve
#    windowsOut: speed 3, popOut bezier            → 333ms, decel curve
#    Requires picom v11 or newer. On older picom, DELETE this block
#    and rebuild without it — everything else keeps working.
animations = (
  {
    triggers = [ "open", "unminimize" ];
    preset = "popin 60%";
    duration = 250;
    curve = "overshoot";
  },
  {
    triggers = [ "close", "minimize" ];
    preset = "popin 60%";
    duration = 333;
    curve = "decelerate";
  }
);

# ── Misc ───────────────────────────────────────────────────────────────────
unredir-if-possible = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; };
  dock    = { shadow = true; opacity = 1.0; };
  desktop = { fade = false; shadow = false; blur-background = false; };
  dnd     = { shadow = false; };
}
