# =============================================================================
# Kitty Terminal Configuration
# Theme: Catppuccin Macchiato
# =============================================================================

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# -----------------------------------------------------------------------------
# Font
# -----------------------------------------------------------------------------
font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
italic_font      FiraCode Nerd Font Italic
bold_italic_font FiraCode Nerd Font Bold Italic
font_size        12.0

disable_ligatures never

# -----------------------------------------------------------------------------
# Cursor
# -----------------------------------------------------------------------------
cursor_shape             beam
cursor_shape_unfocused   hollow
cursor_beam_thickness    1.5
cursor_blink_interval    0.5
cursor_stop_blinking_after 15.0

# Cursor trail
cursor_trail                 50
cursor_trail_decay           0.3 0.8
cursor_trail_start_threshold 2
cursor_trail_color           none
# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------
window_padding_width 8

#background_opacity      0.85 ///disabled due to kitty is opacity affecting VoidDream themes
#dynamic_background_opacity yes ///read the fucking words above this comment

# -----------------------------------------------------------------------------
# Tab Bar
# -----------------------------------------------------------------------------
tab_bar_style       powerline
tab_powerline_style slanted

# -----------------------------------------------------------------------------
# Scrollback
# -----------------------------------------------------------------------------
scrollback_lines 10000

# -----------------------------------------------------------------------------
# Shell Integration
# -----------------------------------------------------------------------------
shell_integration enabled

# -----------------------------------------------------------------------------
# URL Handling
# -----------------------------------------------------------------------------
detect_urls    yes
open_url_with  default
