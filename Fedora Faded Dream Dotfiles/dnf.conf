#
# /etc/dnf/dnf.conf
# Fedora package manager configuration
# See dnf.conf(5) manpage for option and repository directives
#

[main]

# -----------------------------------------------------------------------------
# Paths (defaults are commented out)
# -----------------------------------------------------------------------------
#cachedir=/var/cache/dnf
#keepcache=False
#logdir=/var/log/dnf
#logfile=/var/log/dnf.log
#logrotate=0
#persistdir=/var/lib/dnf
#reposdir=/etc/yum.repos.d

# -----------------------------------------------------------------------------
# Download
# -----------------------------------------------------------------------------
#parallel_downloads=3
#max_parallel_downloads=20
#minrate=1000
#timeout=30
#retries=10
#throttle=0
#bandwidth=0

# -----------------------------------------------------------------------------
# Package Filters
# -----------------------------------------------------------------------------
#installonly_limit=3
#installonlypkgs=kernel,kernel-bigmem,installonlypkg(kernel-module),installonlypkg(vm),kernel-debug,kernel-debug-devel,kernel-tools,kernel-tools-libs
#excludepkgs=
#includepkgs=
#ignorepkgs=
#exactarch=1

# -----------------------------------------------------------------------------
# Misc Options
# -----------------------------------------------------------------------------
#assumeno=False
#assumeyes=False
#skip_if_unavailable=False
#check_config_file_age=True
#repo_gpgcheck=False
#localpkg_gpgcheck=False
#gpgcheck=True
#gpgkey=
#sslverify=True
#sslcacert=
#sslclientcert=
#sslclientkey=
#history_record=True
#history_record_packages=dnf,rpm
#history_list_view=commands
#upgrade_group_objects_upgrade=True
#clean_requirements_on_remove=True
#best=True
#skip_broken=False
#install_weak_deps=True
#fastestmirror=True
#deltarpm=True
#zchunk=False
#zstd_compression_level=3
#metadata_expire=6h
#metadata_expire_filter=read-only-past
#timer=20m

# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------
color=always
#color=auto
#color=never

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
#plugins=True
#pluginpath=/usr/lib/dnf/plugins,/usr/lib64/dnf/plugins
#pluginconfpath=/etc/dnf/plugins

# =============================================================================
# REPOSITORIES
# Enabled repositories are defined in /etc/yum.repos.d/
# This file only contains global options.
# =============================================================================

# -----------------------------------------------------------------------------
# Recommended: Enable fastestmirror and max_parallel_downloads for performance
# -----------------------------------------------------------------------------
fastestmirror=True
max_parallel_downloads=10
defaultyes=True
keepcache=False
install_weak_deps=False