#
# /etc/pacman.conf  —  Faded Dream (Arch Linux)
#
# =============================================================================
# GENERAL OPTIONS
# =============================================================================

[options]

HoldPkg       = pacman glibc
Architecture  = auto

ParallelDownloads = 5
DownloadUser      = alpm

# -----------------------------------------------------------------------------
# Package Filters
# -----------------------------------------------------------------------------
#IgnorePkg   =
#IgnoreGroup =
#NoUpgrade   =
#NoExtract   =

# -----------------------------------------------------------------------------
# Misc Options
# -----------------------------------------------------------------------------
Color
ILoveCandy
CheckSpace

# -----------------------------------------------------------------------------
# Signature Verification
# Run `pacman-key --init` before first use. Populate Arch keys with:
#   sudo pacman-key --populate archlinux
# -----------------------------------------------------------------------------
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# =============================================================================
# REPOSITORIES
# Order matters — first match wins regardless of version number.
# =============================================================================

# -----------------------------------------------------------------------------
# Arch Linux Repositories
# [core] was merged into [extra] on Arch; [community] merged into [extra] too.
# -----------------------------------------------------------------------------
[extra]
Include = /etc/pacman.d/mirrorlist

# -----------------------------------------------------------------------------
# 32-bit Support (enabled for gaming / Steam / Lutris / Wine)
# -----------------------------------------------------------------------------
[multilib]
Include = /etc/pacman.d/mirrorlist
