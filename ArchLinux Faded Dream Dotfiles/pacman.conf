#
# /etc/pacman.conf
# See the pacman.conf(5) manpage for option and repository directives
#

# =============================================================================
# GENERAL OPTIONS
# =============================================================================

[options]

# -----------------------------------------------------------------------------
# Paths (defaults are commented out)
# -----------------------------------------------------------------------------
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/

HoldPkg     = pacman glibc
Architecture = auto

# -----------------------------------------------------------------------------
# Download
# -----------------------------------------------------------------------------
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled

ParallelDownloads = 5
DownloadUser = alpm

# -----------------------------------------------------------------------------
# Package Filters
# -----------------------------------------------------------------------------
#IgnorePkg   =
#IgnoreGroup =
#NoUpgrade   =
#NoExtract   =

# -----------------------------------------------------------------------------
# Misc Options
# -----------------------------------------------------------------------------
#UseSyslog
Color
ILoveCandy
#NoProgressBar
CheckSpace
#VerbosePkgLists
#DisableSandboxFilesystem
#DisableSandboxSyscalls

# -----------------------------------------------------------------------------
# Signature Verification
# NOTE: Run `pacman-key --init` before first use.
# Populate Arch keys with `pacman-key --populate archlinux`
# -----------------------------------------------------------------------------
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# =============================================================================
# REPOSITORIES
# Order matters — first match wins regardless of version number.
# URLs support $repo and $arch variables.
# =============================================================================

# -----------------------------------------------------------------------------
# Testing Repositories (disabled by default)
# -----------------------------------------------------------------------------

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

# -----------------------------------------------------------------------------
# Arch Linux Repositories
# -----------------------------------------------------------------------------

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# -----------------------------------------------------------------------------
# 32-bit Support (enable for gaming / Steam / Wine / Lutris)
# -----------------------------------------------------------------------------

[multilib]
Include = /etc/pacman.d/mirrorlist

# -----------------------------------------------------------------------------
# Custom Repository (example)
# -----------------------------------------------------------------------------
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
