#
# refind.conf
# Faded Dream — rEFInd Configuration
#

# ── Boot behaviour ────────────────────────────────────────────────────────────

# Seconds before auto-booting. 0 = wait forever.
timeout 10

# Boot the most recently booted OS by default
default_selection "+"

# Store rEFInd variables on disk instead of NVRAM (safer for most setups)
use_nvram false

# ── Display ───────────────────────────────────────────────────────────────────

# Use maximum available resolution
resolution max

# ── Mouse ─────────────────────────────────────────────────────────────────────

enable_mouse
mouse_size  32
mouse_speed 12

# ── Theme ─────────────────────────────────────────────────────────────────────

include themes/faded-dream/theme.conf

# ── Tools ─────────────────────────────────────────────────────────────────────

showtools shell, reboot, shutdown, firmware

# ── Scan ──────────────────────────────────────────────────────────────────────

# manual only — prevents auto-detected duplicate entries
scanfor manual

# Hide ESP phantom entries
dont_scan_volumes "EFI"
dont_scan_dirs    EFI/refind,EFI/boot,EFI/Linux
dont_scan_files   bootx64.efi,fbx64.efi,mmx64.efi,grubx64.efi,refind_x64.efi

# ── Boot entries ──────────────────────────────────────────────────────────────

# Artix Linux — update PARTUUID to match your system (blkid /dev/sdXY)
menuentry "Artix Linux" {
    icon    /EFI/refind/themes/faded-dream/icons/os_artix.png
    volume  "Artix Linux"
    loader  /boot/vmlinuz-linux
    initrd  /boot/initramfs-linux.img
    options "root=PARTUUID=c3a15c3a-caed-4a25-9e65-17548b6801db rw quiet splash"
    submenuentry "Boot using fallback initramfs" {
        initrd /boot/initramfs-linux-fallback.img
    }
    submenuentry "Boot to terminal" {
        add_options "systemd.unit=multi-user.target"
    }
}

