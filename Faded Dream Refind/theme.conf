# =============================================================================
# Faded Dream — rEFInd Theme
# Starry night space aesthetic
# =============================================================================

# Background
banner       themes/faded-dream/background.png
banner_scale fillscreen

# Icons
icons_dir       themes/faded-dream/icons
big_icon_size   128
small_icon_size 48

# Selection highlight
selection_big   themes/faded-dream/selection_big.png
selection_small themes/faded-dream/selection_small.png

# UI — hide hints and arrows for a clean look
hideui hints,arrows,singleuser

# Boot in graphics mode for a seamless transition
use_graphics_for linux,windows
